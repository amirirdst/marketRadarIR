name: Market Radar IR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

  schedule:
    - cron: "3-59/10 * * * *"
      timezone: "Asia/Tehran"

jobs:
  market-radar:
    if: contains(github.event.head_commit.message, '[test-telegram]') || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Market Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python main.py --once
