name: Market Radar IR

on:
  push:
    branches: [main]

  workflow_dispatch:

  # به‌جای اینکه GitHub هر 10 دقیقه یک Runner جدید بسازد،
  # هر 6 ساعت یک Runner را بالا می‌آوریم و خود برنامه هر 10 دقیقه اجرا می‌شود.
  schedule:
    - cron: "7 0,6,12,18 * * *"
      timezone: "Asia/Tehran"

# فقط یک اجرای دائمی از رادار هم‌زمان فعال باشد.
concurrency:
  group: market-radar-production
  cancel-in-progress: true

jobs:
  market-radar:
    runs-on: ubuntu-latest

    # GitHub-hosted runner حداکثر 6 ساعت اجازه اجرای Job دارد.
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Market Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py --once
          else
            python main.py
          fi
